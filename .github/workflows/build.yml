name: Build Cassette Motion Pro

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  VERSION: 0.16.0

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare Windows bundle folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\windows
          @(
            "Installer build status: NOT STARTED"
            "Version: $env:VERSION"
            ""
            "The workflow stopped before portable or installer artifacts were created."
            "Open the GitHub Actions build log and check the first failed step above Upload Windows bundle."
          ) | Set-Content "dist\windows\INSTALLER-BUILD-STATUS.txt"

      - name: Restore upstream native dependencies
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/Kinovea/Kinovea.git "$env:RUNNER_TEMP\kinovea-upstream"
          $refsSource = "$env:RUNNER_TEMP\kinovea-upstream\Refs"
          $refsTarget = "src\Refs"
          if (Test-Path "src\Refs" -PathType Leaf) {
            Remove-Item "src\Refs" -Force
          }
          New-Item -ItemType Directory -Force $refsTarget | Out-Null
          robocopy $refsSource $refsTarget /E /NFL /NDL /NJH /NJS /NP
          $robocopyExitCode = $LASTEXITCODE
          if ($robocopyExitCode -gt 7) {
            throw "robocopy failed with exit code $robocopyExitCode."
          }
          $global:LASTEXITCODE = 0
          Get-ChildItem $refsTarget | Select-Object Name, Length

      - name: Restore upstream project dependencies
        shell: pwsh
        run: |
          $upstreamRoot = "$env:RUNNER_TEMP\kinovea-upstream"
          $upstreamSrc = "$upstreamRoot\src"
          if (!(Test-Path $upstreamSrc)) {
            $upstreamSrc = $upstreamRoot
          }
          if (!(Test-Path "$upstreamSrc\Kinovea")) {
            throw "Could not find upstream Kinovea project folder under $upstreamSrc."
          }
          $projectFolders = @(Get-ChildItem $upstreamSrc -Directory -Filter "Kinovea.*")
          $expTreeLib = Get-Item "$upstreamSrc\ExpTreeLib" -ErrorAction SilentlyContinue
          if ($expTreeLib) {
            $projectFolders += $expTreeLib
          }
          $projectFolders | ForEach-Object {
            $target = Join-Path "src" $_.Name
            if (!(Test-Path $target)) {
              Write-Host "Restoring upstream project folder $($_.Name)"
              robocopy $_.FullName $target /E /XD bin obj .vs /NFL /NDL /NJH /NJS /NP
              $robocopyExitCode = $LASTEXITCODE
              if ($robocopyExitCode -gt 7) {
                throw "robocopy failed while restoring $($_.Name) with exit code $robocopyExitCode."
              }
              $global:LASTEXITCODE = 0
            }
          }
          if (!(Test-Path "src\Kinovea\app.config") -and (Test-Path "$upstreamSrc\Kinovea\app.config")) {
            Copy-Item "$upstreamSrc\Kinovea\app.config" "src\Kinovea\app.config" -Force
          }
          robocopy "$upstreamSrc\Kinovea" "src\Kinovea" /E /XC /XN /XO /XD bin obj .vs /NFL /NDL /NJH /NJS /NP
          $robocopyExitCode = $LASTEXITCODE
          if ($robocopyExitCode -gt 7) {
            throw "robocopy failed while restoring missing Kinovea app files with exit code $robocopyExitCode."
          }
          $global:LASTEXITCODE = 0
          Get-ChildItem src -Directory -Filter "Kinovea*" | Select-Object Name

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore src/CassetteMotionPro.sln
          Get-ChildItem src -Recurse -Filter packages.config | ForEach-Object {
            Write-Host "Restoring packages from $($_.FullName)"
            nuget restore $_.FullName -PackagesDirectory src\packages
          }
          Get-ChildItem src -Recurse -Filter *.csproj | ForEach-Object {
            Write-Host "Restoring PackageReference dependencies from $($_.FullName)"
            msbuild $_.FullName /t:Restore /p:Platform="x64" /p:Configuration=Release
          }

      - name: Patch FFmpeg headers for CI compiler
        shell: pwsh
        run: |
          $commonHeader = "src\Refs\FFmpeg\include\libavutil\common.h"
          $content = Get-Content $commonHeader -Raw
          if ($content -match "UINT64_C\(0xFFFFFFFF\)") {
            $content = $content -replace "UINT64_C\(0xFFFFFFFF\)", "0xFFFFFFFFULL"
            Set-Content $commonHeader $content
            Write-Host "Patched FFmpeg common.h UINT64_C usage for CI compiler."
          } else {
            Write-Host "FFmpeg common.h UINT64_C patch was already applied."
          }

      - name: Build solution
        run: msbuild src/CassetteMotionPro.sln /p:Platform="x64" /p:Configuration=Release /p:AllowedReferenceRelatedFileExtensions=none /p:AllowUnsafeBlocks=true

      - name: Verify and stage x64 video assemblies
        shell: pwsh
        run: |
          $output = "src\Kinovea\bin\x64\Release"
          if (!(Test-Path $output)) {
            throw "Expected x64 output folder was not found: $output"
          }

          function Get-PeMachine($path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            switch ($machine) {
              0x014c { return "x86" }
              0x8664 { return "x64" }
              0x0200 { return "IA64" }
              default { return ("0x{0:X4}" -f $machine) }
            }
          }

          $startupPlugins = @(
            @{
              Name = "Kinovea.Camera"
              Project = "src\Kinovea.Camera\Kinovea.Camera.csproj"
              Source = "src\Kinovea.Camera\bin\x64\Release\Kinovea.Camera.dll"
              Dll = "Kinovea.Camera.dll"
            },
            @{
              Name = "Kinovea.Camera.DirectShow"
              Project = "src\Kinovea.Camera.DirectShow\Kinovea.Camera.DirectShow.csproj"
              Source = "src\Kinovea\bin\x64\Release\Kinovea.Camera.DirectShow.dll"
              Dll = "Kinovea.Camera.DirectShow.dll"
            },
            @{
              Name = "Kinovea.Camera.FrameGenerator"
              Project = "src\Kinovea.Camera.FrameGenerator\Kinovea.Camera.FrameGenerator.csproj"
              Source = "src\Kinovea\bin\x64\Release\Kinovea.Camera.FrameGenerator.dll"
              Dll = "Kinovea.Camera.FrameGenerator.dll"
            },
            @{
              Name = "Kinovea.Camera.HTTP"
              Project = "src\Kinovea.Camera.HTTP\Kinovea.Camera.HTTP.csproj"
              Source = "src\Kinovea\bin\x64\Release\Kinovea.Camera.HTTP.dll"
              Dll = "Kinovea.Camera.HTTP.dll"
            },
            @{
              Name = "Kinovea.Video"
              Project = "src\Kinovea.Video\Kinovea.Video.csproj"
              Source = "src\Kinovea.Video\bin\x64\Release\Kinovea.Video.dll"
              Dll = "Kinovea.Video.dll"
            },
            @{
              Name = "Kinovea.Video.Bitmap"
              Project = "src\Kinovea.Video.Bitmap\Kinovea.Video.Bitmap.csproj"
              Source = "src\Kinovea\bin\x64\Release\Kinovea.Video.Bitmap.dll"
              Dll = "Kinovea.Video.Bitmap.dll"
            },
            @{
              Name = "Kinovea.Video.GIF"
              Project = "src\Kinovea.Video.GIF\Kinovea.Video.GIF.csproj"
              Source = "src\Kinovea\bin\x64\Release\Kinovea.Video.GIF.dll"
              Dll = "Kinovea.Video.GIF.dll"
            },
            @{
              Name = "Kinovea.Video.SVG"
              Project = "src\Kinovea.Video.SVG\Kinovea.Video.SVG.csproj"
              Source = "src\Kinovea\bin\x64\Release\Kinovea.Video.SVG.dll"
              Dll = "Kinovea.Video.SVG.dll"
            },
            @{
              Name = "Kinovea.Video.Synthetic"
              Project = "src\Kinovea.Video.Synthetic\Kinovea.Video.Synthetic.csproj"
              Source = "src\Kinovea\bin\x64\Release\Kinovea.Video.Synthetic.dll"
              Dll = "Kinovea.Video.Synthetic.dll"
            },
            @{
              Name = "Kinovea.Video.FFMpeg"
              Project = "src\Kinovea.Video.FFMpeg\PlayerServer\PlayerServer.vcxproj"
              Source = "src\Kinovea.Video.FFMpeg\bin\Kinovea.Video.FFMpeg.dll"
              Dll = "Kinovea.Video.FFMpeg.dll"
            }
          )

          foreach ($plugin in $startupPlugins) {
            if (!(Test-Path $plugin.Project)) {
              throw "$($plugin.Name) project was not restored: $($plugin.Project)"
            }

            Remove-Item (Join-Path $output $plugin.Dll) -Force -ErrorAction SilentlyContinue
            Remove-Item $plugin.Source -Force -ErrorAction SilentlyContinue

            msbuild $plugin.Project /p:Platform="x64" /p:Configuration=Release /p:AllowUnsafeBlocks=true
            if ($LASTEXITCODE -ne 0) {
              throw "$($plugin.Name) x64 rebuild failed with exit code $LASTEXITCODE."
            }

            if (!(Test-Path $plugin.Source)) {
              throw "Fresh x64 $($plugin.Dll) was not created at $($plugin.Source)"
            }
            $sourceMachine = Get-PeMachine $plugin.Source
            Write-Host "$($plugin.Dll) source machine: $sourceMachine"
            if ($sourceMachine -ne "x64") {
              throw "$($plugin.Dll) was expected to be x64, but was $sourceMachine at $($plugin.Source)"
            }
            $destination = Join-Path $output $plugin.Dll
            if ([System.IO.Path]::GetFullPath($plugin.Source) -ieq [System.IO.Path]::GetFullPath($destination)) {
              Write-Host "$($plugin.Dll) is already in the package output folder."
            } else {
              Copy-Item $plugin.Source $output -Force
              Write-Host "Staged fresh x64 assembly: $($plugin.Dll)"
            }
          }

          $exe = Join-Path $output "CassetteMotionPro.exe"
          if (!(Test-Path $exe)) {
            throw "CassetteMotionPro.exe was not found in $output"
          }
          $exeMachine = Get-PeMachine $exe
          Write-Host "CassetteMotionPro.exe machine: $exeMachine"
          if ($exeMachine -ne "x64") {
            throw "CassetteMotionPro.exe was expected to be x64, but was $exeMachine."
          }

          foreach ($plugin in $startupPlugins) {
            $packagedDll = Join-Path $output $plugin.Dll
            if (!(Test-Path $packagedDll)) {
              throw "$($plugin.Dll) was not found in $output"
            }
            $packagedMachine = Get-PeMachine $packagedDll
            Write-Host "$($plugin.Dll) packaged machine: $packagedMachine"
            if ($packagedMachine -ne "x64") {
              Get-ChildItem "src" -Recurse -Include "Kinovea.Video*.dll","Kinovea.Camera*.dll" | Select-Object FullName, Length
              throw "Architecture mismatch detected. Expected x64 $($plugin.Dll), got $packagedMachine at $packagedDll."
            }
          }

      - name: Restore drawing and measurement tools
        shell: pwsh
        run: |
          $output = "src\Kinovea\bin\x64\Release"
          if (!(Test-Path $output)) {
            throw "Expected x64 output folder was not found: $output"
          }

          $upstreamRoot = "$env:RUNNER_TEMP\kinovea-upstream"
          if (!(Test-Path $upstreamRoot)) {
            throw "Expected upstream Kinovea checkout was not found: $upstreamRoot"
          }

          $candidates = @(
            "$upstreamRoot\DrawingTools",
            "$upstreamRoot\src\DrawingTools",
            "$upstreamRoot\src\Kinovea\DrawingTools",
            "$upstreamRoot\src\Kinovea\Resources\DrawingTools",
            "$upstreamRoot\Kinovea\DrawingTools"
          )

          $source = $null
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              $source = (Get-Item $candidate).FullName
              break
            }
          }

          if (-not $source) {
            $source = Get-ChildItem $upstreamRoot -Directory -Recurse -Filter "DrawingTools" |
              Where-Object { @(Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue).Count -gt 0 } |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $source) {
            throw "Kinovea DrawingTools folder was not found in the upstream checkout."
          }

          $target = Join-Path $output "DrawingTools"
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          robocopy $source $target /E /NFL /NDL /NJH /NJS /NP
          $robocopyExitCode = $LASTEXITCODE
          if ($robocopyExitCode -gt 7) {
            throw "robocopy failed while restoring DrawingTools with exit code $robocopyExitCode."
          }
          $global:LASTEXITCODE = 0

          $toolFiles = @(Get-ChildItem $target -Recurse -File -ErrorAction SilentlyContinue)
          if ($toolFiles.Count -eq 0) {
            throw "DrawingTools was copied but did not contain any files."
          }

          Write-Host "Restored DrawingTools from $source to $target"
          $toolFiles | Select-Object -First 20 FullName, Length

      - name: Create portable settings folder
        shell: cmd
        run: mkdir src\Kinovea\bin\x64\Release\AppData

      - name: Create portable zip for Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\windows
          Compress-Archive -Path "src\Kinovea\bin\x64\Release\*" -DestinationPath "dist\windows\CassetteMotionPro-Portable-$env:VERSION.zip" -Force
          @(
            "Installer build status: NOT RUN"
            "Version: $env:VERSION"
            ""
            "The portable zip was created."
            "If this file was not replaced with SUCCESS or FAILED, the workflow stopped before the Build installer step."
            "Open the GitHub Actions build log and check Install NSIS and Build installer."
          ) | Set-Content "dist\windows\INSTALLER-BUILD-STATUS.txt"
          Get-ChildItem dist\windows

      - name: Upload portable application
        uses: actions/upload-artifact@v6
        with:
          name: CassetteMotionPro-Portable-${{ env.VERSION }}
          path: src/Kinovea/bin/x64/Release/

      - name: Remove portable settings folder
        shell: cmd
        run: rmdir src\Kinovea\bin\x64\Release\AppData

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (!(Test-Path $nsisPath)) {
            $nsisPath = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          }
          if (!(Test-Path $nsisPath)) {
            throw "makensis.exe was not found after installing NSIS."
          }
          "MAKENSIS_PATH=$nsisPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $nsisPath /VERSION

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\installer
          New-Item -ItemType Directory -Force dist\windows
          try {
            if ([string]::IsNullOrWhiteSpace($env:MAKENSIS_PATH) -or !(Test-Path $env:MAKENSIS_PATH)) {
              throw "MAKENSIS_PATH is missing or invalid: $env:MAKENSIS_PATH"
            }

            Push-Location src\Installer
            Write-Host "Installer source files:"
            Get-ChildItem -Force | Select-Object Name, Length
            & $env:MAKENSIS_PATH /DVERSION=$env:VERSION kinovea.nsi
            $makensisExitCode = $LASTEXITCODE
            Pop-Location

            if ($makensisExitCode -ne 0) {
              throw "makensis exited with code $makensisExitCode."
            }

            $installer = Get-ChildItem -Path . -Filter "CassetteMotionPro-$env:VERSION.exe" -File -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $installer) {
              $installer = Get-ChildItem -Path . -Filter "CassetteMotionPro-*.exe" -File -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            }

            if (-not $installer) {
              Write-Host "No installer found. Listing EXE files for debugging:"
              Get-ChildItem -Path . -Filter "*.exe" -Recurse | Select-Object FullName
              throw "Installer exe was not created."
            }

            Copy-Item $installer.FullName "dist\installer\CassetteMotionPro-Installer-$env:VERSION.exe" -Force
            Copy-Item $installer.FullName "dist\windows\CassetteMotionPro-Installer-$env:VERSION.exe" -Force
            @(
              "Installer build status: SUCCESS"
              "Version: $env:VERSION"
              "NSIS: $env:MAKENSIS_PATH"
              "Installer source: $($installer.FullName)"
              "Installer artifact: CassetteMotionPro-Installer-$env:VERSION.exe"
              "Windows bundle: CassetteMotionPro-Windows-$env:VERSION"
            ) | Set-Content "dist\windows\INSTALLER-BUILD-STATUS.txt"
            Get-ChildItem dist\installer
            Get-ChildItem dist\windows
          }
          catch {
            if ((Get-Location).Path -like "*\src\Installer") {
              Pop-Location
            }

            @(
              "Installer build status: FAILED"
              "Version: $env:VERSION"
              "NSIS: $env:MAKENSIS_PATH"
              "Error: $($_.Exception.Message)"
              ""
              "The portable zip should still be in this Windows bundle."
              "Open the GitHub Actions build log and search for: Build installer"
            ) | Set-Content "dist\windows\INSTALLER-BUILD-STATUS.txt"
            Write-Host "Installer build failed. EXE files found during diagnostics:"
            Get-ChildItem -Path . -Filter "*.exe" -Recurse | Select-Object FullName
            throw
          }

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: CassetteMotionPro-Installer-${{ env.VERSION }}
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Upload Windows bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: CassetteMotionPro-Windows-${{ env.VERSION }}
          path: dist/windows/*
          if-no-files-found: error
